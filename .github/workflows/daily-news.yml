name: Daily News Generation

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Authenticate Claude CLI
        env:
          CLAUDE_CREDENTIALS: ${{ secrets.CLAUDE_CREDENTIALS }}
        run: |
          mkdir -p ~/.claude
          echo "$CLAUDE_CREDENTIALS" > ~/.claude/.credentials.json
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Debug Claude CLI
        run: |
          which claude || echo "claude not found"
          claude --version || echo "version failed"
          claude -p "reply with just: ok" 2>&1 || echo "exit code: $?"

      - name: Generate daily articles
        run: python scripts/generate_news.py

      - name: Commit and push articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles/
          git diff --cached --quiet || git commit -m "chore: daily articles $(date -u +%Y-%m-%d)"
          git push
